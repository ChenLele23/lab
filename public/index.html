<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab9 WebApp</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; margin: 24px; max-width: 900px; }
      .row { display: flex; gap: 12px; flex-wrap: wrap; }
      input, button { padding: 8px 10px; }
      button { cursor: pointer; }
      .card { border: 1px solid #ddd; border-radius: 10px; padding: 16px; margin-top: 16px; }
      ul { padding-left: 18px; }
      li { margin: 6px 0; }
      .muted { color: #666; }
    </style>
  </head>
  <body>
    <h1>Lab9 WebApp (Express + PostgreSQL)</h1>
    <p class="muted">Demo: login + todos</p>

    <div class="card">
      <h2>Login</h2>
      <div class="row">
        <input id="username" placeholder="username" value="admin" />
        <input id="password" placeholder="password" value="admin" type="password" />
        <button id="loginBtn">Login</button>
      </div>
      <p id="loginStatus" class="muted"></p>
    </div>

    <div class="card">
      <h2>Todos</h2>
      <div class="row">
        <input id="todoTitle" placeholder="New todo title" />
        <button id="addTodoBtn">Add</button>
      </div>
      <ul id="todoList"></ul>
    </div>

    <script>
      const loginStatus = document.getElementById('loginStatus');

      async function login() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });

        loginStatus.textContent = res.ok ? 'Login ok' : 'Login failed';
      }

      async function fetchTodos() {
        const res = await fetch('/api/todos');
        const todos = await res.json();
        const ul = document.getElementById('todoList');
        ul.innerHTML = '';
        for (const t of todos) {
          const li = document.createElement('li');
          const cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.checked = t.done;
          cb.addEventListener('change', async () => {
            await fetch(`/api/todos/${t.id}`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ done: cb.checked }),
            });
            fetchTodos();
          });

          const btn = document.createElement('button');
          btn.textContent = 'Delete';
          btn.addEventListener('click', async () => {
            await fetch(`/api/todos/${t.id}`, { method: 'DELETE' });
            fetchTodos();
          });

          li.append(cb, ' ', document.createTextNode(t.title + ' '), btn);
          ul.appendChild(li);
        }
      }

      async function addTodo() {
        const title = document.getElementById('todoTitle').value.trim();
        if (!title) return;
        await fetch('/api/todos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title }),
        });
        document.getElementById('todoTitle').value = '';
        fetchTodos();
      }

      document.getElementById('loginBtn').addEventListener('click', login);
      document.getElementById('addTodoBtn').addEventListener('click', addTodo);

      fetchTodos();
    </script>
  </body>
</html>
